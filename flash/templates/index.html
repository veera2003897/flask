<!DOCTYPE html>
<html>
<head>
    <title>Flask Flash Example</title>
</head>
<body>
    <h1>Welcome to the Home Page</h1>

    <!-- Display flashed messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}

                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <a href="{{ url_for('action_success') }}">Trigger Success</a>
    <a href="{{ url_for('action_error') }}">Trigger Error</a>
</body>
</html>
